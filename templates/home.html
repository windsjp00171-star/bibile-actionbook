<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經互動全書</title>
{% include '_pwa.html' %}
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="{{ static_v('tokens.css') }}">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#14171A;--brown-dark:var(--poche);--brown-mid:var(--poche-2);--brown-light:var(--poche-3);
  --gold:var(--sun);--cream:var(--wall);
}
html,body{height:100%;font-family:'Noto Serif TC',serif;}
body{background:var(--bg);color:var(--cream);overflow:hidden;}

/* 共用 */
.screen{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .4s;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.screen.show{opacity:1;pointer-events:all;}
.back-btn{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;background:var(--poche);border-top:1px solid var(--poche-3);font-size:14px;color:var(--poche-ink);cursor:pointer;border:none;font-family:'Noto Serif TC',serif;transition:background .15s;letter-spacing:.08em;z-index:20;}
.back-btn:hover{background:var(--poche-2);color:var(--gold);}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--poche-mute);letter-spacing:.08em;margin-bottom:10px;}
.bc-sep{color:var(--brown-light);}
.bc-active{color:var(--poche-ink);}
.bc-link{cursor:pointer;transition:color .15s;}
.bc-link:hover{color:var(--poche-ink);}
.orn{display:flex;align-items:center;gap:10px;width:220px;}
.orn-line{flex:1;height:1px;background:linear-gradient(to right,transparent,var(--poche-3),transparent);}
.orn-dia{width:6px;height:6px;background:var(--sun);transform:rotate(45deg);flex-shrink:0;}

/* 1. 進入：天亮（首次或 30 天未訪才顯示；動畫 240ms，可點擊跳過） */
#s-book{z-index:10;background:var(--bg);cursor:pointer;}
.entry{position:relative;width:min(420px,86vw);text-align:center;padding:48px 0 96px;overflow:hidden;}
.entry-beam{position:absolute;left:-4%;bottom:24px;width:108%;height:3px;background:var(--sun);transform-origin:left center;transform:rotate(-6deg) scaleX(1);}
.entry-title{font-size:36px;font-weight:600;color:var(--wall);letter-spacing:.32em;padding-left:.32em;}
.entry-sub{margin-top:10px;font-size:15px;color:var(--poche-ink);letter-spacing:.2em;padding-left:.2em;}
.entry-btn{margin-top:44px;min-width:200px;min-height:56px;padding:14px 36px;border:1px solid var(--sun);border-radius:8px;background:transparent;color:var(--sun-glow);font-family:inherit;font-size:18px;letter-spacing:.3em;padding-left:calc(36px + .3em);cursor:pointer;transition:background .15s,color .15s;}
.entry-btn:hover{background:var(--sun);color:var(--poche);}
.home-copyright{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--poche-mute);letter-spacing:.04em;z-index:2;}
@keyframes dawn{from{transform:rotate(-6deg) scaleX(0);}to{transform:rotate(-6deg) scaleX(1);}}
.entry.play .entry-beam{animation:dawn .24s cubic-bezier(.2,.8,.2,1) both;}
@media (prefers-reduced-motion:reduce){.entry.play .entry-beam{animation:none;}.screen{transition:none;}}

/* 2. 存檔 */
#s-menu{z-index:9;background:var(--bg);}
.menu-card{background:var(--brown-dark);border:1px solid var(--brown-light);border-radius:10px;width:320px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.35);}
.menu-head{background:var(--poche-2);padding:14px 20px;border-bottom:1px solid var(--brown-light);display:flex;align-items:center;gap:8px;}
.menu-head-title{font-size:14px;color:var(--gold);letter-spacing:.08em;}
.save-slot{padding:14px 20px;border-bottom:1px solid var(--brown-mid);display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s;}
.save-slot:hover{background:var(--brown-mid);}
.slot-icon{width:34px;height:34px;border-radius:6px;background:var(--poche-2);border:1px solid var(--brown-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.slot-info{flex:1;}
.slot-book{font-size:13px;color:var(--gold);margin-bottom:3px;}
.slot-detail{font-size:12px;color:var(--poche-ink);font-weight:300;}
.new-btn{width:100%;padding:14px 20px;background:none;border:none;border-top:1px solid var(--brown-mid);display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s;font-family:'Noto Serif TC',serif;}
.new-btn:hover{background:var(--brown-mid);}
.new-btn-label{font-size:13px;color:var(--poche-ink);font-weight:300;letter-spacing:.04em;}

/* 3. 新舊約 */
#s-testament{z-index:8;}
.testament-row{display:flex;gap:16px;}
.testament-card{width:140px;height:155px;padding:16px;background:var(--brown-dark);border:1px solid var(--brown-light);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;}
.testament-card:hover{background:var(--brown-mid);border-color:var(--gold);transform:translateY(-2px);}
.tc-icon{font-size:26px;color:var(--gold);}
.tc-title{font-size:19px;font-weight:500;color:var(--gold);letter-spacing:.12em;}
.tc-count{font-size:12px;color:var(--poche-ink);font-weight:300;}

/* 4. 經卷 */
#s-books{z-index:7;}
.book-grid-wrap{width:340px;max-height:360px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--poche-3) transparent;}
.book-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.book-btn{background:var(--brown-dark);border:1px solid var(--brown-mid);border-radius:6px;padding:7px 4px;text-align:center;cursor:pointer;transition:background .12s,border-color .12s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.book-btn:hover{background:var(--brown-mid);border-color:#566070;}
.book-num{font-size:12px;color:var(--poche-mute);font-family:sans-serif;}
.book-name{font-size:12px;color:var(--sun-glow);font-weight:300;line-height:1.4;}

/* 5. 章節 */
#s-chapters{z-index:6;}
.chapter-wrap{width:340px;}
.chapter-header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.ch-book-name{font-size:18px;font-weight:500;color:var(--gold);letter-spacing:.06em;}
.ch-total{font-size:12px;color:var(--poche-ink);font-weight:300;}
.chapter-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-height:240px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--poche-3) transparent;}
.ch-btn{background:var(--brown-dark);border:1px solid var(--brown-mid);border-radius:5px;padding:8px 2px;text-align:center;cursor:pointer;font-size:12px;color:var(--poche-ink);transition:background .12s,border-color .12s,color .12s;}
.ch-btn:hover{background:var(--brown-mid);border-color:#566070;color:var(--gold);}
.ch-btn.selected{background:var(--brown-mid);border-color:var(--gold);color:var(--gold);}
.enter-btn{background:var(--poche-2);border:1px solid var(--gold);border-radius:6px;padding:10px 28px;cursor:pointer;font-family:'Noto Serif TC',serif;font-size:13px;color:var(--gold);letter-spacing:.1em;display:flex;align-items:center;gap:8px;transition:background .15s;margin-top:12px;}
.enter-btn:hover{background:var(--brown-light);}

</style>
</head>
<body>

<!-- 1. 進入 -->
<div class="screen" id="s-book">
  <div class="entry" id="entry">
    <div class="entry-beam" aria-hidden="true"></div>
    <div class="entry-title">聖經全書</div>
    <div class="entry-sub">互動閱讀</div>
    <button class="entry-btn" id="entryBtn" type="button">進入</button>
  </div>
  <div class="home-copyright">經文採用《和合本》（Chinese Union Version，1919）· 公有領域</div>
</div>

<!-- 2. 存檔選單 -->
<div class="screen" id="s-menu">
  <div class="menu-card">
    <div class="menu-head">
      <i class="ti ti-device-floppy" style="color:var(--gold);font-size:16px" aria-hidden="true"></i>
      <span class="menu-head-title">讀取存檔</span>
    </div>
    <!-- [後端] GET /api/reading-progress → 渲染最近兩筆，無資料時隱藏 slot -->
    <div class="save-slot" id="slot1" onclick="enterChapter('撒母耳記上',17)">
      <div class="slot-icon"><i class="ti ti-book-2" style="color:var(--gold);font-size:15px"></i></div>
      <div class="slot-info">
        <div class="slot-book" id="slot1-book">撒母耳記上・第十七章</div>
        <div class="slot-detail" id="slot1-detail">大衛與歌利亞　· 昨天</div>
      </div>
      <i class="ti ti-chevron-right" style="color:var(--poche-mute)"></i>
    </div>
    <div class="save-slot" id="slot2" onclick="enterChapter('約翰福音',3)">
      <div class="slot-icon"><i class="ti ti-book" style="color:var(--poche-ink);font-size:15px"></i></div>
      <div class="slot-info">
        <div class="slot-book" id="slot2-book">約翰福音・第三章</div>
        <div class="slot-detail" id="slot2-detail">尼哥底母　· 三天前</div>
      </div>
      <i class="ti ti-chevron-right" style="color:var(--poche-mute)"></i>
    </div>
    <button class="new-btn" onclick="showScreen('s-testament')">
      <div class="slot-icon"><i class="ti ti-plus" style="color:var(--poche-ink);font-size:15px"></i></div>
      <span class="new-btn-label">從頭開始，選擇書卷</span>
      <i class="ti ti-chevron-right" style="color:var(--poche-mute);margin-left:auto"></i>
    </button>
    <a class="new-btn" href="/search" style="text-decoration:none">
      <div class="slot-icon"><i class="ti ti-search" style="color:var(--poche-ink);font-size:15px"></i></div>
      <span class="new-btn-label">🔍 全本搜尋</span>
      <i class="ti ti-chevron-right" style="color:var(--poche-mute);margin-left:auto"></i>
    </a>
    <a class="new-btn" href="/kings" style="text-decoration:none">
      <div class="slot-icon"><i class="ti ti-crown" style="color:var(--poche-ink);font-size:15px"></i></div>
      <span class="new-btn-label">南北國列王對照表</span>
      <i class="ti ti-chevron-right" style="color:var(--poche-mute);margin-left:auto"></i>
    </a>
  </div>
</div>

<!-- 3. 新舊約 -->
<div class="screen" id="s-testament">
  <button class="back-btn" onclick="showScreen('s-menu')"><i class="ti ti-arrow-left"></i> 返回</button>
  <div class="orn"><div class="orn-line"></div><div class="orn-dia"></div><div class="orn-line"></div></div>
  <div class="testament-row" style="margin:20px 0;">
    <div class="testament-card" onclick="goBooks('old')">
      <i class="ti ti-book tc-icon"></i>
      <div class="tc-title">舊　約</div>
      <div class="tc-count">39 卷・929 章</div>
    </div>
    <div class="testament-card" onclick="goBooks('new')">
      <i class="ti ti-book-2 tc-icon"></i>
      <div class="tc-title">新　約</div>
      <div class="tc-count">27 卷・260 章</div>
    </div>
  </div>
  <div class="orn"><div class="orn-line"></div><div class="orn-dia"></div><div class="orn-line"></div></div>
</div>

<!-- 4. 經卷 -->
<div class="screen" id="s-books">
  <button class="back-btn" onclick="showScreen('s-testament')"><i class="ti ti-arrow-left"></i> 返回</button>
  <div style="text-align:center;margin-bottom:14px;">
    <div style="font-size:11px;color:var(--poche-mute);letter-spacing:.14em;margin-bottom:6px;">── 經卷選擇 ──</div>
    <div id="bc-books-t" style="font-size:22px;font-weight:500;color:var(--gold);letter-spacing:.14em;">舊約</div>
  </div>
  <div class="book-grid-wrap"><div class="book-grid" id="bookGrid"></div></div>
</div>

<!-- 5. 章節 -->
<div class="screen" id="s-chapters">
  <button class="back-btn" onclick="showScreen('s-books')"><i class="ti ti-arrow-left"></i> 返回</button>
  <div class="breadcrumb">
    <span class="bc-link" onclick="showScreen('s-testament')" id="bc-ch-t">舊約</span>
    <span class="bc-sep">›</span>
    <span class="bc-link" onclick="showScreen('s-books')" id="bc-ch-b">撒母耳記上</span>
    <span class="bc-sep">›</span>
    <span class="bc-active">選擇章節</span>
  </div>
  <div class="chapter-wrap">
    <div class="chapter-header">
      <span class="ch-book-name" id="chBookName"></span>
      <span class="ch-total" id="chTotal"></span>
    </div>
    <div class="chapter-grid" id="chapterGrid"></div>
  </div>
  <button class="enter-btn" id="enterBtn" style="display:none">
    <i class="ti ti-book-open"></i>開始閱讀
  </button>
</div>

<script>
/* 資料 */
const OLD=[
  {n:'創世記',c:50},{n:'出埃及記',c:40},{n:'利未記',c:27},{n:'民數記',c:36},{n:'申命記',c:34},
  {n:'約書亞記',c:24},{n:'士師記',c:21},{n:'路得記',c:4},{n:'撒母耳記上',c:31},{n:'撒母耳記下',c:24},
  {n:'列王紀上',c:22},{n:'列王紀下',c:25},{n:'歷代志上',c:29},{n:'歷代志下',c:36},{n:'以斯拉記',c:10},
  {n:'尼希米記',c:13},{n:'以斯帖記',c:10},{n:'約伯記',c:42},{n:'詩篇',c:150},{n:'箴言',c:31},
  {n:'傳道書',c:12},{n:'雅歌',c:8},{n:'以賽亞書',c:66},{n:'耶利米書',c:52},{n:'耶利米哀歌',c:5},
  {n:'以西結書',c:48},{n:'但以理書',c:12},{n:'何西阿書',c:14},{n:'約珥書',c:3},{n:'阿摩司書',c:9},
  {n:'俄巴底亞書',c:1},{n:'約拿書',c:4},{n:'彌迦書',c:7},{n:'那鴻書',c:3},{n:'哈巴谷書',c:3},
  {n:'西番雅書',c:3},{n:'哈該書',c:2},{n:'撒迦利亞書',c:14},{n:'瑪拉基書',c:4}
];
const NEW=[
  {n:'馬太福音',c:28},{n:'馬可福音',c:16},{n:'路加福音',c:24},{n:'約翰福音',c:21},{n:'使徒行傳',c:28},
  {n:'羅馬書',c:16},{n:'哥林多前書',c:16},{n:'哥林多後書',c:13},{n:'加拉太書',c:6},{n:'以弗所書',c:6},
  {n:'腓立比書',c:4},{n:'歌羅西書',c:4},{n:'帖撒羅尼迦前書',c:5},{n:'帖撒羅尼迦後書',c:3},{n:'提摩太前書',c:6},
  {n:'提摩太後書',c:4},{n:'提多書',c:3},{n:'腓利門書',c:1},{n:'希伯來書',c:13},{n:'雅各書',c:5},
  {n:'彼得前書',c:5},{n:'彼得後書',c:3},{n:'約翰一書',c:5},{n:'約翰二書',c:1},{n:'約翰三書',c:1},
  {n:'猶大書',c:1},{n:'啟示錄',c:22}
];

/* 畫面切換 */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  document.getElementById(id).classList.add('show');
}

/* 進入：首次或 30 天未訪才顯示；回訪者直接進選單 */
(function(){
  let last=0;
  try{last=parseInt(localStorage.getItem('bible-entered')||'0',10);}catch(e){}
  function enter(){
    try{localStorage.setItem('bible-entered',String(Date.now()));}catch(e){}
    showScreen('s-menu');
    loadProgress();
  }
  if(Date.now()-last<30*24*3600*1000){enter();return;}
  showScreen('s-book');
  document.getElementById('entry').classList.add('play');
  document.getElementById('s-book').addEventListener('click',enter);
  document.getElementById('entryBtn').focus({preventScroll:true});
})();

/* 選書流程 */
let curT='old', selBook=null, selCh=null;

function goBooks(t){
  curT=t;
  const label=t==='old'?'舊約':'新約';
  document.getElementById('bc-books-t').textContent=label;
  document.getElementById('bc-ch-t').textContent=label;
  const data=t==='old'?OLD:NEW;
  const grid=document.getElementById('bookGrid');
  grid.innerHTML='';
  data.forEach((b,i)=>{
    const btn=document.createElement('div');
    btn.className='book-btn';
    btn.innerHTML=`<div class="book-num">${i+1}</div><div class="book-name">${b.n}</div>`;
    btn.onclick=()=>goChapters(b);
    grid.appendChild(btn);
  });
  showScreen('s-books');
}

function goChapters(b){
  selBook=b; selCh=null;
  document.getElementById('bc-ch-b').textContent=b.n;
  document.getElementById('chBookName').textContent=b.n;
  document.getElementById('chTotal').textContent=`共 ${b.c} 章`;
  const grid=document.getElementById('chapterGrid');
  grid.innerHTML='';
  for(let i=1;i<=b.c;i++){
    const btn=document.createElement('div');btn.className='ch-btn';btn.textContent=i;
    const ch=i;
    btn.onclick=()=>{
      selCh=ch;
      document.querySelectorAll('.ch-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('enterBtn').style.display='flex';
    };
    grid.appendChild(btn);
  }
  document.getElementById('enterBtn').style.display='none';
  document.getElementById('enterBtn').onclick=()=>enterChapter(selBook.n, selCh);
  showScreen('s-chapters');
}

/* 進入閱讀 → 導向既有閱讀頁（含標註、地圖、世系圖、AI解釋、回報按鈕） */
function enterChapter(bookName, chapter){
  window.location.href='/read/'+encodeURIComponent(bookName)+'/'+chapter;
}

/* 裝置 ID（無登入，存檔以此識別；與閱讀頁共用同一把 key） */
function deviceId(){
  let id=localStorage.getItem('bible-device-id');
  if(!id){ id=(crypto.randomUUID?crypto.randomUUID():'dev-'+Date.now()+'-'+Math.random().toString(16).slice(2)); localStorage.setItem('bible-device-id',id); }
  return id;
}
function relTime(iso){
  if(!iso) return '';
  const d=new Date(iso), days=Math.floor((Date.now()-d)/86400000);
  if(days<=0) return '今天'; if(days===1) return '昨天';
  if(days<7) return days+'天前'; if(days<30) return Math.floor(days/7)+'週前';
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
}
/* 載入最近兩筆存檔；無資料隱藏該 slot */
function loadProgress(){
  fetch('/api/progress?user_id='+encodeURIComponent(deviceId()))
    .then(r=>r.json()).then(d=>{
      const recs=(d&&d.records)||[];
      for(let i=0;i<2;i++){
        const slot=document.getElementById('slot'+(i+1)), rec=recs[i];
        if(rec){
          slot.style.display='flex';
          document.getElementById('slot'+(i+1)+'-book').textContent=rec.book_name+'・第'+rec.chapter+'章';
          document.getElementById('slot'+(i+1)+'-detail').textContent=relTime(rec.updated_at);
          slot.onclick=()=>enterChapter(rec.book_name,rec.chapter);
        } else { slot.style.display='none'; }
      }
    }).catch(()=>{
      document.getElementById('slot1').style.display='none';
      document.getElementById('slot2').style.display='none';
    });
}

</script>
{% include '_install_hint.html' %}
</body>
</html>
