<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全本搜尋 · 聖經互動全書</title>
{% include '_pwa.html' %}
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ static_v('tokens.css') }}">
<link rel="stylesheet" href="{{ static_v('section-art.css') }}">
<link rel="stylesheet" href="{{ static_v('style.css') }}">
<style>
.sp-wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px;}
.sp-head{text-align:center;margin-bottom:20px;}
.sp-title{font-size:22px;color:var(--ink);letter-spacing:.08em;margin-bottom:4px;}
.sp-sub{font-size:13px;color:var(--ink-4);}
.sp-row{display:flex;gap:8px;margin-bottom:6px;}
.sp-row input{flex:1;padding:11px 14px;border:1px solid #CFCEC4;border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
.sp-row button{padding:11px 20px;border:none;border-radius:10px;background:var(--action);color:#fff;font-size:15px;cursor:pointer;font-family:inherit;}
.sp-meta{font-size:12px;color:var(--ink-4);margin:10px 2px;}
.sp-hit{display:block;padding:12px 8px;border-bottom:1px solid var(--wall-2);text-decoration:none;color:var(--ink-2);}
.sp-hit:active{background:var(--wall-2);}
.sp-ref{display:block;font-size:12px;color:var(--action);margin-bottom:3px;font-weight:500;}
.sp-text{font-size:15px;font-weight:300;line-height:1.8;}
.sp-hit mark{background:#E2A62E55;color:inherit;}
.sp-empty{color:var(--ink-4);font-size:14px;padding:16px 2px;text-align:center;}
.sp-back{display:inline-block;margin-bottom:16px;color:var(--ink-4);text-decoration:none;font-size:13px;}
</style>
</head>
<body class="search-page">
<div class="sp-wrap">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <a class="sp-back" href="/" style="margin:0">‹ 回首頁</a>
    <button id="tourBtn" data-tour="search-tour" class="tour-trigger" type="button" onclick="startSearchTour()"
      style="background:var(--action);color:#fff;border:none;border-radius:14px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit">💡 教學</button>
  </div>
  <div class="header-art">{% set sa_class = 'on-light' %}{% set sa_view = '310 245 480 200' %}{% set sa_once = true %}{% include '_section_art.html' %}</div>
  <div class="sp-head">
    <div class="sp-title">🔍 全本搜尋</div>
    <div class="sp-sub">搜尋整本聖經（66 卷）的經文</div>
  </div>
  <div class="sp-row">
    <input type="text" id="q" data-tour="search-q" placeholder="輸入關鍵字，如「歌利亞」「愛是恆久忍耐」" autocomplete="off" value="{{ q }}">
    <button onclick="run()">搜尋</button>
  </div>
  <div class="sp-meta" id="meta"></div>
  <div id="results" data-tour="search-results"></div>
  <p style="text-align:center;font-size:12px;color:var(--ink-4);margin-top:30px">經文採用《和合本》（Chinese Union Version，1919）· 公有領域</p>
</div>
<script src="{{ static_v('js/section-art.js') }}"></script>
<script src="{{ static_v('js/tour.js') }}"></script>
<script>
const SEARCH_TOUR_STEPS = [
  { title: '歡迎！這是搜尋教學 👋', text: '這頁可以一次搜尋整本聖經（66 卷）。我帶你看怎麼用，看完按「下一步」就好。' },
  { sel: '[data-tour="search-q"]', title: '輸入關鍵字', text: '打人名、地名或一句經文（如「歌利亞」「愛是恆久忍耐」），按 Enter 或右邊「搜尋」。', spot: 6 },
  { sel: '[data-tour="search-results"]', title: '搜尋結果', text: '會列出所有符合的經節，點任一筆直接跳到聖經那一節閱讀。', spot: 6 },
  { sel: '[data-tour="search-tour"]', title: '完成！🎉', text: '忘記了隨時點這顆「💡 教學」再看一次。' },
];
function startSearchTour(){
  const b=document.getElementById('tourBtn'); if(b) b.classList.remove('pulse');
  try{ localStorage.setItem('search-tour-last', String(Date.now())); }catch(e){}
  SpotlightTour.start(SEARCH_TOUR_STEPS);
}
(function(){ // 沒看過或隔 5 天 → 教學鈕脈動提醒
  try{
    const last=parseInt(localStorage.getItem('search-tour-last')||'0',10);
    if(Date.now()-last > 5*24*60*60*1000){ const b=document.getElementById('tourBtn'); if(b) b.classList.add('pulse'); }
  }catch(e){}
})();
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function hl(text,q){const i=text.indexOf(q);if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(q)+'</mark>'+esc(text.slice(i+q.length));}
function run(){
  const q=document.getElementById('q').value.trim();
  const meta=document.getElementById('meta'), box=document.getElementById('results');
  if(!q){meta.textContent='';box.innerHTML='';return;}
  history.replaceState(null,'','/search?q='+encodeURIComponent(q));
  meta.textContent='搜尋中…';box.innerHTML='';
  fetch('/api/search?q='+encodeURIComponent(q)+'&limit=300').then(r=>r.json()).then(d=>{
    meta.textContent='找到 '+d.total+' 節'+(d.truncated?'（顯示前 300）':'');
    box.innerHTML='';
    d.results.forEach(r=>{
      const a=document.createElement('a');a.className='sp-hit';
      a.href='/read/'+encodeURIComponent(r.book)+'/'+r.chapter+'?v='+r.verse;
      a.innerHTML='<span class="sp-ref">'+r.book+' '+r.chapter+':'+r.verse+'</span><span class="sp-text">'+hl(r.text,q)+'</span>';
      box.appendChild(a);
    });
    if(!d.results.length)box.innerHTML='<p class="sp-empty">查無符合的經文。</p>';
  }).catch(()=>{meta.textContent='搜尋失敗，請稍後再試。';});
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')run();});
if(document.getElementById('q').value.trim())run();
document.getElementById('q').focus();
</script>
</body>
</html>
